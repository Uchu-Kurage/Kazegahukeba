; Godot のエクスポート設定。エディタの「プロジェクト > エクスポート」を保存するとここが書き換わる。
; ここでは GitHub Pages で配布するための Web(HTML5) プリセットを定義している。
;
; ★GitHub Pages で動かすための肝：variant/thread_support=false（スレッド無効）。
;   スレッドを有効にすると SharedArrayBuffer が必要になり、ブラウザが
;   COOP/COEP ヘッダ（Cross-Origin-Opener/Embedder-Policy）を要求する。
;   GitHub Pages はこれらのヘッダを付けられないため、無効化して単一スレッドで動かす。

[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
